<!DOCTYPE html>

  <title>TWST board</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #06061A;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(6, 1fr); 
      gap: 15px;
      max-width: 800px;
    }

    .card {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid #30363d;
      transition: opacity 0.2s ease-in-out;
    }

    .eliminated {
      opacity: 0.15; 
    }
    
    .card:hover {
      border-color: #FC90DD;
    }
  </style>
</head>
