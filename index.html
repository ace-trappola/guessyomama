<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TWST board</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #06061A;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(6, 1fr); 
      gap: 15px;
      max-width: 800px;
    }

    .card {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid #30363d;
      transition: opacity 0.2s ease-in-out;
    }

    .eliminated {
      opacity: 0.15; 
    }
    
    .card:hover {
      border-color: #FC90DD;
    }
  </style>
</head>
<body>

  <div class="board">
    <img src="https://i.pinimg.com/736x/54/d2/b4/54d2b41ef62eef44ee52243a7e86143a.jpg" alt="ace" class="card" onclick="this.classList.toggle('eliminated')">
